<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <!-- Logo Glow / Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Background with smooth squircle border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Background Decorative Academic Radial Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#primaryGrad)" opacity="0.12" filter="blur(30px)" />

  <!-- Core Logo Emblem: Stylized Academic U + Open Knowledge Wings -->
  <g filter="url(#dropShadow)">
    
    <!-- Left Wing of Knowledge / U Pillar -->
    <path d="M 148 136 
             C 148 124, 160 114, 172 118 
             L 204 128 
             C 214 131, 220 141, 220 152 
             L 220 270 
             C 220 320, 240 348, 256 348 
             C 240 348, 148 310, 148 240 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Right Wing of Knowledge / U Pillar -->
    <path d="M 364 136 
             C 364 124, 352 114, 340 118 
             L 308 128 
             C 298 131, 292 141, 292 152 
             L 292 270 
             C 292 320, 272 348, 256 348 
             C 272 348, 364 310, 364 240 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Center Connected Base: Dynamic Hub Curve -->
    <path d="M 172 230 
             C 172 330, 210 380, 256 380 
             C 302 380, 340 330, 340 230 
             C 340 200, 310 200, 310 230 
             C 310 300, 286 338, 256 338 
             C 226 338, 202 300, 202 230 
             C 202 200, 172 200, 172 230 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Central Knowledge Spark / Star of Excellence -->
    <path d="M 256 160 
             L 264 184 
             L 288 192 
             L 264 200 
             L 256 224 
             L 248 200 
             L 224 192 
             L 248 184 
             Z" 
          fill="url(#goldGrad)" 
          filter="url(#glowEffect)" />

    <!-- Open Book Pages Horizon -->
    <path d="M 190 398 
             C 220 388, 244 394, 256 404 
             C 268 394, 292 388, 322 398 
             C 330 401, 330 411, 322 411 
             C 292 405, 268 412, 256 422 
             C 244 412, 220 405, 190 411 
             C 182 411, 182 401, 190 398 
             Z" 
          fill="#38BDF8" opacity="0.9" />

  </g>

  <!-- Wordmark Text: UNIHUB at the base -->
  <text x="256" y="472" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#FFFFFF">UNIHUB</text>
</svg>
